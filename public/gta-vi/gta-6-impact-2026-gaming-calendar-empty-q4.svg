<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <rect width="1200" height="630" fill="#0a0a1a"/>
  <rect x="0" y="0" width="1200" height="4" fill="#FF1493"/>
  <rect x="0" y="626" width="1200" height="4" fill="#00FFFF"/>
  <!-- Calendar icon -->
  <rect x="490" y="160" width="220" height="180" rx="10" fill="none" stroke="#00FFFF" stroke-width="4"/>
  <rect x="490" y="160" width="220" height="40" rx="10" fill="#FF1493" opacity="0.3"/>
  <line x1="490" y1="200" x2="710" y2="200" stroke="#00FFFF" stroke-width="2"/>
  <!-- Calendar hooks -->
  <line x1="540" y1="150" x2="540" y2="175" stroke="#00FFFF" stroke-width="4" stroke-linecap="round"/>
  <line x1="660" y1="150" x2="660" y2="175" stroke="#00FFFF" stroke-width="4" stroke-linecap="round"/>
  <!-- Q1-Q3 filled cells -->
  <rect x="505" y="212" width="45" height="25" rx="3" fill="#FF1493" opacity="0.5"/>
  <rect x="558" y="212" width="45" height="25" rx="3" fill="#FF1493" opacity="0.5"/>
  <rect x="611" y="212" width="45" height="25" rx="3" fill="#FF1493" opacity="0.5"/>
  <!-- Q4 empty cell with X -->
  <rect x="664" y="212" width="35" height="25" rx="3" fill="none" stroke="#00FFFF" stroke-width="2" stroke-dasharray="4,2"/>
  <!-- Q labels -->
  <text x="528" y="230" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#ffffff">Q1</text>
  <text x="581" y="230" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#ffffff">Q2</text>
  <text x="634" y="230" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#ffffff">Q3</text>
  <text x="682" y="230" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#00FFFF">Q4</text>
  <!-- Empty rows -->
  <text x="600" y="290" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#00FFFF" opacity="0.4">EMPTY</text>
  <!-- 2026 in calendar -->
  <text x="600" y="185" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#FF1493" font-weight="bold">2026</text>
  <!-- Game name -->
  <text x="600" y="80" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#FF1493" letter-spacing="4" font-weight="bold">GTA VI</text>
  <!-- Title -->
  <text x="600" y="440" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="46" fill="#00FFFF" font-weight="bold">2026 Calendar Impact</text>
  <!-- Subtitle -->
  <text x="600" y="485" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#ffffff" opacity="0.5">The Empty Q4 Effect</text>
  <!-- Watermark -->
  <text x="1160" y="610" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#ffffff" opacity="0.2">PopCodex</text>
</svg>