<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <rect width="1200" height="630" fill="#0a0a1a"/>
  <rect x="0" y="0" width="1200" height="4" fill="#FF1493"/>
  <rect x="0" y="626" width="1200" height="4" fill="#00FFFF"/>
  <!-- Price tag icon -->
  <rect x="545" y="170" width="110" height="80" rx="8" fill="none" stroke="#FF1493" stroke-width="4" transform="rotate(-15, 600, 210)"/>
  <circle cx="575" cy="200" r="8" fill="#00FFFF" transform="rotate(-15, 600, 210)"/>
  <!-- Dollar sign -->
  <text x="610" y="250" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="60" fill="#00FFFF" font-weight="bold">$</text>
  <!-- Decorative tag string -->
  <line x1="560" y1="178" x2="540" y2="158" stroke="#FF1493" stroke-width="3"/>
  <!-- Game name -->
  <text x="600" y="80" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#FF1493" letter-spacing="4" font-weight="bold">GTA VI</text>
  <!-- Title -->
  <text x="600" y="440" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="52" fill="#00FFFF" font-weight="bold">Price &amp; Editions</text>
  <!-- Subtitle -->
  <text x="600" y="485" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#ffffff" opacity="0.5">Pre-Order Guide</text>
  <!-- Watermark -->
  <text x="1160" y="610" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#ffffff" opacity="0.2">PopCodex</text>
</svg>