<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <rect width="1200" height="630" fill="#0a0a1a"/>
  <rect x="0" y="0" width="1200" height="4" fill="#FF1493"/>
  <rect x="0" y="626" width="1200" height="4" fill="#00FFFF"/>
  <!-- Play button triangle -->
  <polygon points="560,190 560,310 660,250" fill="none" stroke="#FF1493" stroke-width="5"/>
  <!-- Question mark -->
  <text x="680" y="290" font-family="Arial, Helvetica, sans-serif" font-size="80" fill="#00FFFF" font-weight="bold" opacity="0.8">?</text>
  <!-- Game name -->
  <text x="600" y="80" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#FF1493" letter-spacing="4" font-weight="bold">GTA VI</text>
  <!-- Title -->
  <text x="600" y="440" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="52" fill="#00FFFF" font-weight="bold">Trailer 3?</text>
  <!-- Subtitle -->
  <text x="600" y="485" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#ffffff" opacity="0.5">When Is the Next Reveal?</text>
  <!-- Watermark -->
  <text x="1160" y="610" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#ffffff" opacity="0.2">PopCodex</text>
</svg>