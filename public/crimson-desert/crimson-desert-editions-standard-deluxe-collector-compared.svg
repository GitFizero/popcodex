<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <rect width="1200" height="630" fill="#1a0a0a"/>
  <rect x="0" y="0" width="1200" height="4" fill="#DC2626"/>
  <rect x="0" y="626" width="1200" height="4" fill="#D4A946"/>
  <!-- Three boxes -->
  <rect x="370" y="170" width="100" height="130" rx="8" fill="none" stroke="#DC2626" stroke-width="4"/>
  <rect x="550" y="150" width="100" height="150" rx="8" fill="none" stroke="#D4A946" stroke-width="4"/>
  <rect x="730" y="130" width="100" height="170" rx="8" fill="none" stroke="#DC2626" stroke-width="4"/>
  <!-- Box labels -->
  <text x="420" y="340" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#DC2626">Standard</text>
  <text x="600" y="340" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#D4A946">Deluxe</text>
  <text x="780" y="340" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#DC2626">Collector</text>
  <!-- Stars in boxes -->
  <text x="420" y="245" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#DC2626">&#9733;</text>
  <text x="600" y="235" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="34" fill="#D4A946">&#9733;&#9733;</text>
  <text x="780" y="225" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#DC2626">&#9733;&#9733;&#9733;</text>
  <!-- Game name -->
  <text x="600" y="80" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#DC2626" letter-spacing="4" font-weight="bold">CRIMSON DESERT</text>
  <!-- Title -->
  <text x="600" y="440" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="52" fill="#D4A946" font-weight="bold">Editions Compared</text>
  <!-- Watermark -->
  <text x="1160" y="610" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#ffffff" opacity="0.2">PopCodex</text>
</svg>