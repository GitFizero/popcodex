<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <rect width="1200" height="630" fill="#1a0a0a"/>
  <rect x="0" y="0" width="1200" height="4" fill="#DC2626"/>
  <rect x="0" y="626" width="1200" height="4" fill="#D4A946"/>
  <!-- Clock icon -->
  <circle cx="600" cy="260" r="90" fill="none" stroke="#DC2626" stroke-width="6"/>
  <circle cx="600" cy="260" r="6" fill="#D4A946"/>
  <line x1="600" y1="260" x2="600" y2="195" stroke="#D4A946" stroke-width="5" stroke-linecap="round"/>
  <line x1="600" y1="260" x2="645" y2="260" stroke="#D4A946" stroke-width="4" stroke-linecap="round"/>
  <!-- Hour markers -->
  <line x1="600" y1="178" x2="600" y2="188" stroke="#DC2626" stroke-width="3"/>
  <line x1="600" y1="332" x2="600" y2="342" stroke="#DC2626" stroke-width="3"/>
  <line x1="518" y1="260" x2="528" y2="260" stroke="#DC2626" stroke-width="3"/>
  <line x1="672" y1="260" x2="682" y2="260" stroke="#DC2626" stroke-width="3"/>
  <!-- Countdown arrows -->
  <polygon points="480,260 460,248 460,272" fill="#DC2626" opacity="0.5"/>
  <polygon points="720,260 740,248 740,272" fill="#DC2626" opacity="0.5"/>
  <!-- Game name -->
  <text x="600" y="80" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#DC2626" letter-spacing="4" font-weight="bold">CRIMSON DESERT</text>
  <!-- Title -->
  <text x="600" y="440" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="52" fill="#D4A946" font-weight="bold">Release Times</text>
  <!-- Subtitle -->
  <text x="600" y="485" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#ffffff" opacity="0.5">Preload &amp; Launch FAQ</text>
  <!-- Watermark -->
  <text x="1160" y="610" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#ffffff" opacity="0.2">PopCodex</text>
</svg>