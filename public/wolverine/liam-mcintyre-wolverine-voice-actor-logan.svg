<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <rect width="1200" height="630" fill="#1a1a0a"/>
  <rect x="0" y="0" width="1200" height="4" fill="#EAB308"/>
  <rect x="0" y="626" width="1200" height="4" fill="#DC2626"/>
  <!-- Microphone -->
  <rect x="570" y="170" width="30" height="50" rx="15" fill="none" stroke="#EAB308" stroke-width="4"/>
  <path d="M555,210 Q555,245 585,245 Q615,245 615,210" fill="none" stroke="#EAB308" stroke-width="3"/>
  <line x1="585" y1="245" x2="585" y2="270" stroke="#EAB308" stroke-width="3"/>
  <line x1="568" y1="270" x2="602" y2="270" stroke="#EAB308" stroke-width="3"/>
  <!-- Sound waves -->
  <path d="M540,185 Q525,200 540,215" fill="none" stroke="#EAB308" stroke-width="2" opacity="0.5"/>
  <path d="M525,175 Q505,200 525,225" fill="none" stroke="#EAB308" stroke-width="2" opacity="0.3"/>
  <!-- Silhouette (simple head/shoulders) -->
  <circle cx="680" cy="210" r="30" fill="#DC2626" opacity="0.5"/>
  <path d="M640,310 Q640,260 680,250 Q720,260 720,310" fill="#DC2626" opacity="0.4"/>
  <!-- Claw hint near silhouette -->
  <line x1="725" y1="270" x2="745" y2="260" stroke="#EAB308" stroke-width="3" opacity="0.6"/>
  <line x1="725" y1="280" x2="748" y2="275" stroke="#EAB308" stroke-width="3" opacity="0.6"/>
  <line x1="725" y1="290" x2="745" y2="290" stroke="#EAB308" stroke-width="3" opacity="0.6"/>
  <!-- Game name -->
  <text x="600" y="80" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#EAB308" letter-spacing="4" font-weight="bold">MARVEL'S WOLVERINE</text>
  <!-- Title -->
  <text x="600" y="440" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="52" fill="#EAB308" font-weight="bold">Liam McIntyre</text>
  <!-- Subtitle -->
  <text x="600" y="485" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#ffffff" opacity="0.5">The Voice of Logan</text>
  <!-- Watermark -->
  <text x="1160" y="610" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#ffffff" opacity="0.2">PopCodex</text>
</svg>