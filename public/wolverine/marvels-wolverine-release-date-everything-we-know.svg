<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <rect width="1200" height="630" fill="#1a1a0a"/>
  <rect x="0" y="0" width="1200" height="4" fill="#EAB308"/>
  <rect x="0" y="626" width="1200" height="4" fill="#DC2626"/>
  <!-- Claw marks (3 diagonal slashes) -->
  <line x1="520" y1="160" x2="480" y2="320" stroke="#EAB308" stroke-width="8" stroke-linecap="round"/>
  <line x1="560" y1="160" x2="520" y2="320" stroke="#EAB308" stroke-width="8" stroke-linecap="round"/>
  <line x1="600" y1="160" x2="560" y2="320" stroke="#EAB308" stroke-width="8" stroke-linecap="round"/>
  <!-- Secondary claw marks -->
  <line x1="640" y1="170" x2="610" y2="310" stroke="#DC2626" stroke-width="6" stroke-linecap="round" opacity="0.5"/>
  <line x1="670" y1="170" x2="640" y2="310" stroke="#DC2626" stroke-width="6" stroke-linecap="round" opacity="0.5"/>
  <line x1="700" y1="170" x2="670" y2="310" stroke="#DC2626" stroke-width="6" stroke-linecap="round" opacity="0.5"/>
  <!-- Game name -->
  <text x="600" y="80" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#EAB308" letter-spacing="4" font-weight="bold">MARVEL'S WOLVERINE</text>
  <!-- Title -->
  <text x="600" y="440" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="48" fill="#EAB308" font-weight="bold">Everything We Know</text>
  <!-- Subtitle -->
  <text x="600" y="485" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#ffffff" opacity="0.5">Release Date &amp; Details</text>
  <!-- Watermark -->
  <text x="1160" y="610" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#ffffff" opacity="0.2">PopCodex</text>
</svg>