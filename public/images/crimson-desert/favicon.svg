<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#1a0a0a"/>
      <stop offset="100%" style="stop-color:#0a0505"/>
    </radialGradient>
    <radialGradient id="glowRed" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#c0392b;stop-opacity:0.4"/>
      <stop offset="100%" style="stop-color:#c0392b;stop-opacity:0"/>
    </radialGradient>
    <linearGradient id="swordGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e8d5b0"/>
      <stop offset="50%" style="stop-color:#ffffff"/>
      <stop offset="100%" style="stop-color:#b8a070"/>
    </linearGradient>
    <linearGradient id="crimsonGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#e74c3c"/>
      <stop offset="100%" style="stop-color:#7b1010"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f5d87a"/>
      <stop offset="100%" style="stop-color:#c8a92a"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="circle">
      <circle cx="200" cy="200" r="180"/>
    </clipPath>
  </defs>

  <!-- Background circle -->
  <circle cx="200" cy="200" r="190" fill="url(#bgGrad)" stroke="#3d0f0f" stroke-width="2"/>

  <!-- Red glow center -->
  <circle cx="200" cy="200" r="140" fill="url(#glowRed)"/>

  <!-- Outer decorative ring -->
  <circle cx="200" cy="200" r="175" fill="none" stroke="#6b1a1a" stroke-width="1.5" stroke-dasharray="4,6"/>
  <circle cx="200" cy="200" r="168" fill="none" stroke="#3d0f0f" stroke-width="1"/>

  <!-- Corner rune marks -->
  <g fill="none" stroke="#8b2020" stroke-width="1.5" opacity="0.7">
    <!-- Top -->
    <line x1="200" y1="28" x2="200" y2="42"/>
    <line x1="193" y1="35" x2="207" y2="35"/>
    <!-- Bottom -->
    <line x1="200" y1="358" x2="200" y2="372"/>
    <line x1="193" y1="365" x2="207" y2="365"/>
    <!-- Left -->
    <line x1="28" y1="200" x2="42" y2="200"/>
    <line x1="35" y1="193" x2="35" y2="207"/>
    <!-- Right -->
    <line x1="358" y1="200" x2="372" y2="200"/>
    <line x1="365" y1="193" x2="365" y2="207"/>
  </g>

  <!-- Shield shape -->
  <path d="M200 80 L270 110 L270 200 Q270 255 200 290 Q130 255 130 200 L130 110 Z"
        fill="#1a0505" stroke="url(#crimsonGrad)" stroke-width="2.5"/>

  <!-- Shield inner detail -->
  <path d="M200 95 L258 121 L258 200 Q258 247 200 278 Q142 247 142 200 L142 121 Z"
        fill="none" stroke="#4a1010" stroke-width="1"/>

  <!-- Sword vertical -->
  <g filter="url(#glow)">
    <!-- Blade -->
    <polygon points="200,108 205,220 200,232 195,220"
             fill="url(#swordGrad)"/>
    <!-- Guard / crossguard -->
    <rect x="178" y="218" width="44" height="8" rx="2"
          fill="url(#goldGrad)" stroke="#8b6914" stroke-width="0.5"/>
    <!-- Handle -->
    <rect x="196" y="226" width="8" height="28" rx="2"
          fill="url(#goldGrad)" stroke="#8b6914" stroke-width="0.5"/>
    <!-- Pommel -->
    <ellipse cx="200" cy="258" rx="9" ry="6"
             fill="url(#goldGrad)" stroke="#8b6914" stroke-width="0.5"/>
    <!-- Blade edge highlight -->
    <line x1="200" y1="110" x2="200" y2="225" stroke="white" stroke-width="0.8" opacity="0.6"/>
  </g>

  <!-- Book / scroll lines on shield (wiki symbol) -->
  <g opacity="0.5" stroke="#c0392b" stroke-width="1" fill="none">
    <line x1="162" y1="160" x2="185" y2="160"/>
    <line x1="162" y1="168" x2="185" y2="168"/>
    <line x1="162" y1="176" x2="182" y2="176"/>
    <line x1="215" y1="160" x2="238" y2="160"/>
    <line x1="215" y1="168" x2="238" y2="168"/>
    <line x1="218" y1="176" x2="238" y2="176"/>
  </g>

  <!-- Decorative dots at shield corners -->
  <circle cx="200" cy="82" r="3" fill="url(#goldGrad)"/>
  <circle cx="268" cy="112" r="2.5" fill="url(#goldGrad)"/>
  <circle cx="268" cy="200" r="2.5" fill="url(#goldGrad)"/>
  <circle cx="132" cy="112" r="2.5" fill="url(#goldGrad)"/>
  <circle cx="132" cy="200" r="2.5" fill="url(#goldGrad)"/>

  <!-- PYWEL WIKI text -->
  <text x="200" y="318"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="22"
        font-weight="bold"
        letter-spacing="6"
        text-anchor="middle"
        fill="url(#goldGrad)"
        filter="url(#glow)">PYWEL</text>

  <text x="200" y="344"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="13"
        letter-spacing="10"
        text-anchor="middle"
        fill="#8b2020"
        opacity="0.9">WIKI</text>

  <!-- Thin decorative line under title -->
  <line x1="148" y1="350" x2="252" y2="350" stroke="#6b1a1a" stroke-width="0.8"/>
  <circle cx="148" cy="350" r="2" fill="#8b2020"/>
  <circle cx="252" cy="350" r="2" fill="#8b2020"/>

</svg>
