<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <rect width="1200" height="630" fill="#0a1a0a"/>
  <rect x="0" y="0" width="1200" height="4" fill="#22C55E"/>
  <rect x="0" y="626" width="1200" height="4" fill="#FACC15"/>
  <!-- Xbox circle -->
  <circle cx="520" cy="240" r="55" fill="none" stroke="#22C55E" stroke-width="4"/>
  <text x="520" y="248" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#22C55E" font-weight="bold">XBOX</text>
  <!-- PS5 circle -->
  <circle cx="680" cy="240" r="55" fill="none" stroke="#FACC15" stroke-width="4"/>
  <text x="680" y="248" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#FACC15" font-weight="bold">PS5</text>
  <!-- Connection line -->
  <line x1="575" y1="240" x2="625" y2="240" stroke="#22C55E" stroke-width="3" stroke-dasharray="6,4"/>
  <!-- Checkmark on PS5 -->
  <circle cx="720" cy="195" r="14" fill="#22C55E"/>
  <polyline points="712,195 718,202 730,188" fill="none" stroke="#0a1a0a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Game name -->
  <text x="600" y="80" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#22C55E" letter-spacing="4" font-weight="bold">FABLE</text>
  <!-- Title -->
  <text x="600" y="440" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="52" fill="#FACC15" font-weight="bold">PS5 Confirmed</text>
  <!-- Subtitle -->
  <text x="600" y="485" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#ffffff" opacity="0.5">Xbox Multiplatform Strategy</text>
  <!-- Watermark -->
  <text x="1160" y="610" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#ffffff" opacity="0.2">PopCodex</text>
</svg>