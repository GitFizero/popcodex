<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <rect width="1200" height="630" fill="#0a1a0a"/>
  <rect x="0" y="0" width="1200" height="4" fill="#22C55E"/>
  <rect x="0" y="626" width="1200" height="4" fill="#FACC15"/>
  <!-- Castle/village silhouette -->
  <!-- Ground line -->
  <line x1="400" y1="310" x2="800" y2="310" stroke="#22C55E" stroke-width="2" opacity="0.5"/>
  <!-- Castle tower left -->
  <rect x="460" y="220" width="30" height="90" fill="#22C55E" opacity="0.6"/>
  <rect x="455" y="210" width="40" height="15" fill="#22C55E" opacity="0.6"/>
  <!-- Battlements -->
  <rect x="455" y="205" width="8" height="10" fill="#22C55E" opacity="0.6"/>
  <rect x="467" y="205" width="8" height="10" fill="#22C55E" opacity="0.6"/>
  <rect x="479" y="205" width="8" height="10" fill="#22C55E" opacity="0.6"/>
  <!-- Main castle body -->
  <rect x="490" y="250" width="100" height="60" fill="#22C55E" opacity="0.5"/>
  <!-- Castle tower right -->
  <rect x="590" y="230" width="35" height="80" fill="#22C55E" opacity="0.6"/>
  <polygon points="590,230 607,195 625,230" fill="#FACC15" opacity="0.5"/>
  <!-- Gate -->
  <path d="M530,310 L530,280 Q540,268 550,280 L550,310" fill="#0a1a0a"/>
  <!-- Houses/village -->
  <rect x="650" y="270" width="35" height="40" fill="#22C55E" opacity="0.4"/>
  <polygon points="648,270 667,248 687,270" fill="#22C55E" opacity="0.4"/>
  <rect x="700" y="280" width="30" height="30" fill="#22C55E" opacity="0.3"/>
  <polygon points="698,280 715,262 732,280" fill="#22C55E" opacity="0.3"/>
  <!-- Trees -->
  <polygon points="430,310 440,260 450,310" fill="#22C55E" opacity="0.3"/>
  <polygon points="750,310 760,265 770,310" fill="#22C55E" opacity="0.3"/>
  <!-- Game name -->
  <text x="600" y="80" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#22C55E" letter-spacing="4" font-weight="bold">FABLE</text>
  <!-- Title -->
  <text x="600" y="440" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="52" fill="#FACC15" font-weight="bold">Story of Albion</text>
  <!-- Subtitle -->
  <text x="600" y="485" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#ffffff" opacity="0.5">Briar Hill &amp; The Hero</text>
  <!-- Watermark -->
  <text x="1160" y="610" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#ffffff" opacity="0.2">PopCodex</text>
</svg>