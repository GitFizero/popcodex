<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <rect width="1200" height="630" fill="#0a1a0a"/>
  <rect x="0" y="0" width="1200" height="4" fill="#22C55E"/>
  <rect x="0" y="626" width="1200" height="4" fill="#FACC15"/>
  <!-- TV/Monitor icon -->
  <rect x="510" y="155" width="180" height="120" rx="8" fill="none" stroke="#22C55E" stroke-width="4"/>
  <!-- Screen content - play button -->
  <polygon points="580,200 580,250 620,225" fill="#FACC15" opacity="0.7"/>
  <!-- TV stand -->
  <line x1="570" y1="275" x2="550" y2="310" stroke="#22C55E" stroke-width="3"/>
  <line x1="630" y1="275" x2="650" y2="310" stroke="#22C55E" stroke-width="3"/>
  <line x1="540" y1="310" x2="660" y2="310" stroke="#22C55E" stroke-width="3"/>
  <!-- Broadcast waves -->
  <path d="M700 180 Q720 215 700 250" fill="none" stroke="#FACC15" stroke-width="2" opacity="0.6"/>
  <path d="M715 170 Q740 215 715 260" fill="none" stroke="#FACC15" stroke-width="2" opacity="0.4"/>
  <!-- Game name -->
  <text x="600" y="80" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#22C55E" letter-spacing="4" font-weight="bold">FABLE</text>
  <!-- Title -->
  <text x="600" y="440" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="52" fill="#FACC15" font-weight="bold">Developer Direct</text>
  <!-- Subtitle -->
  <text x="600" y="485" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#ffffff" opacity="0.5">Everything Revealed</text>
  <!-- Watermark -->
  <text x="1160" y="610" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#ffffff" opacity="0.2">PopCodex</text>
</svg>